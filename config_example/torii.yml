# Torii refuses to start when this file is missing or has a YAML error, an unknown key or an
# invalid value, and reports every problem it finds. The same holds for each site's rules, where
# every section is required as well;
# on reload (SIGHUP) a rejected rule set leaves the rules already in use untouched.
# Addresses the HTTP server listens on: "host:port" for TCP, "unix:/path" for a Unix domain socket.
# Both kinds can be listed together. An empty host listens on every interface.
listen:
  - ":25555"
  # - "unix:/run/server_torii.sock"
# Where the connector's request reports are received (`torii_log` in nginx): "host:port" for UDP,
# "unix:/path" for a Unix datagram socket. Reports are trusted and not authenticated, so keep
# this reachable from nginx only. When omitted, Torii listens on UDP 127.0.0.1, on the port of
# the first TCP address in `listen`; with only Unix sockets in `listen` it has to be set.
# log_listen:
#   - "unix:/run/server_torii_log.sock"
# Permission of the Unix sockets (octal). The nginx worker user must be able to write to the socket.
# unix_socket_mode: "0666"
web_path: "/torii"
error_page: "/www/server_torii/config/error_page"
# `server_torii.log` is the node itself: start, reload, gossip. `<site id>/events.log` has one
# line for every request of the site that was not let through, and for every block and
# challenge installed:
#   2026/11/14 21:31:07 [info] decision ip=203.0.113.9 verdict=block reason=Lists:office method=GET host=example.com uri=/admin ua="curl/8.5.0" SIGHUP opens the files again, so log rotation
# renames them and then sends SIGHUP; the same signal reloads the site rules.
log_path: "/www/server_torii/log/"
# The least level that is logged; a level includes the ones above it.
#   error  what needs attention: with nothing wrong, nothing is logged but the start and the stop
#   warn   also what is degraded and still works: a peer that is unreachable, a missing page
#   info   also every request that was not let through, every block installed, every reload
#   debug  also every request that was let through, with what each check did
# SIGHUP reads this one setting again, so the level can be changed without a restart.
log_level: info
# The one secret of a cluster, at least 32 characters. It signs the cookies of every site and
# the gossip messages; every node needs the same value, and a cookie issued by one node is then
# accepted by all of them. Changing it makes every client pass its challenge again.
# This example value is public: anyone who knows it can issue cookies. Generate your own, e.g.
# with `openssl rand -hex 16`. It is refused when gossip is enabled.
global_secret: "0378b0f84c4310279918d71a5647ba5d"
node_name: "Server Torii"
# Every protected site has an ID. Nginx names the site of a request with `torii_site <id>;`.
# An ID may contain letters, digits and underscores, at most 32 characters. Rate counters,
# temporary blocks, logs and traffic analysis are kept per site.
sites:
  - id: "default_site"
    rule_path: "/www/server_torii/config/rules/default"
  - id: "example"
    rule_path: "/www/server_torii/config/rules/example.com"
    # A site can have pages of its own. A page this directory does not hold is taken from the
    # `error_page` directory above.
    # error_page: "/www/server_torii/config/error_page/example.com"
# How many bits of an IPv6 address identify one client for rate limits, temporary blocks and
# traffic analysis. A client can take any address of the /64 it is usually given, so counting
# single addresses would let it escape every limit. Every node of a cluster needs the same value.
# ipv6_prefix: 64
# The site for requests that name none. Remove it to give such requests no decision.
default_site: "default_site"

# The nodes of a cluster tell one another about the temporary blocks and challenges they
# install, so a client blocked on one node is blocked on all of them.
enable_gossip: false
# The other nodes of the cluster.
peers:
  - name: "Node-B"
    address: "http://10.0.0.2:25555"
    host: "node-b.local"
