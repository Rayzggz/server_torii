# Torii refuses to start when this file is missing or has a YAML error, an unknown key or an
# invalid value, and reports every problem it finds. The same holds for each site's rules;
# on reload (SIGHUP) a rejected rule set leaves the rules already in use untouched.
port: "25555"
# Addresses the HTTP server listens on: "host:port" for TCP, "unix:/path" for a Unix domain socket.
# Both kinds can be listed together. When omitted, Torii listens on every interface on `port`.
# `port` is also the default UDP port for request reports, see `log_listen`.
# listen:
#   - "127.0.0.1:25555"
#   - "unix:/run/server_torii.sock"
# Where the connector's request reports are received (`torii_log` in nginx): "host:port" for UDP,
# "unix:/path" for a Unix datagram socket. Reports are trusted and not authenticated, so keep
# this reachable from nginx only. When omitted, Torii listens on UDP 127.0.0.1:`port`.
# log_listen:
#   - "unix:/run/server_torii_log.sock"
# Permission of the Unix sockets (octal). The nginx worker user must be able to write to the socket.
# unix_socket_mode: "0666"
web_path: "/torii"
error_page: "/www/server_torii/config/error_page"
log_path: "/www/server_torii/log/"
# Signs gossip messages; every node of a cluster needs the same value, at least 32 characters.
# Required when `enable_gossip` is true, and this example value is refused then: generate your
# own, e.g. with `openssl rand -hex 16`.
global_secret: "0378b0f84c4310279918d71a5647ba5d"
node_name: "Server Torii"
enable_gossip: false
# Every protected site has an ID. Nginx names the site of a request with `torii_site <id>;`.
# An ID may contain letters, digits and underscores, at most 32 characters. Rate counters,
# temporary blocks, logs and traffic analysis are kept per site.
sites:
  - id: "default_site"
    rule_path: "/www/server_torii/config/rules/default"
  - id: "example"
    rule_path: "/www/server_torii/config/rules/example.com"
# The site for requests that name none. Remove it to give such requests no decision.
default_site: "default_site"

peers:
  - name: "Node-B"
    address: "http://10.0.0.2:25555"
    host: "node-b.local"