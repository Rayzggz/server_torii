IPAllow:
  enabled: true
IPBlock:
  enabled: true
IPCAPTCHA:
  enabled: false
URLAllow:
  enabled: true
URLBlock:
  enabled: true
URLCAPTCHA:
  enabled: false
CountryRule:
  enabled: false
  default_action: block
  unknown_action: continue
  countries:
    GB: continue
    US: captcha
CAPTCHA:
  enabled: true
  provider: "hcaptcha"
  secret_key: "0378b0f84c4310279918d71a5647ba5d"
  captcha_validate_time: 600
  captcha_challenge_session_timeout: 120
  hcaptcha_secret: ""
  altcha_hmac_secret: "0378b0f84c4310279918d71a5647ba5d"
  altcha_cost: 50000
  CaptchaFailureLimit:
    - "300/300s"
  failure_block_duration: 1200
HTTPFlood:
  enabled: true
  HTTPFloodSpeedLimit:
    - "150/10s"
  HTTPFloodSameURILimit:
    - "50/10s"
  HTTPFloodFailureLimit:
    - "300/300s"
  failure_block_duration: 1200
VerifyBot:
  enabled: true
  verify_google_bot: true
  verify_bing_bot: true
  verify_baidu_bot: true
  verify_yandex_bot: true
  verify_sogou_bot: true
  verify_apple_bot: true
ExternalMigration:
  enabled: false
  redirect_url: "https://example.com/migration"
  secret_key: "0378b0f84c4310279918d71a5647ba5d"
  session_timeout: 1800
AdaptiveTrafficAnalyzer:
  enabled: true
  tag: "default_site"
  analysis_interval: 10
  window_buckets: 30
  browser_evidence: # decides which clients look like browsers; used by both detections and captcha_unverified
    ttl: 21600
    distinct_pages: 3
    asset_extensions: [] # empty uses the built-in static asset list
  uri_detection:
    action: captcha_unverified # observe | captcha_unverified | captcha | block; captcha_unverified challenges only clients without browser evidence
    block_duration: 600
    min_requests: 100
    min_distinct_ips: 50
    sustain: 60
    ratio_threshold: 5
    fallback_share: 0.8
    baseline:
      half_life: 21600
      warmup: 3600
      min_reference_requests: 200
  ip_detection:
    enabled: true
    action: observe # observe | captcha | block
    block_duration: 600
    max_block_duration: 86400
    score_threshold: 50
    hot_uri_min_hits: 3
    min_failures: 30
    fail_rate_threshold: 0.6
    scan_paths_threshold: 30
    max_broadcast_per_tick: 200
CustomRules: # Cloudflare-style expression rules, evaluated top to bottom after the IP/URL allow and block lists
  enabled: false
  # Fields: ip.src, ip.src.country (alias ip.geoip.country), http.host, http.request.uri, http.request.uri.path,
  #   http.request.uri.query, http.request.uri.path.extension, http.request.uri.args["k"], http.request.method,
  #   http.user_agent, http.referer, http.cookie, http.x_forwarded_for, http.request.headers["name"],
  #   http.request.cookies["name"], torii.browser_evidence
  #   http.request.method needs Nginx to send the original method: proxy_set_header Torii-Original-Method $request_method;
  # Operators: eq ==, ne !=, contains, wildcard, strict wildcard, matches ~, in {...}, lt le gt ge (len() only)
  # Logic: not !, and &&, xor ^^, or || (in this precedence order), parentheses
  # Functions: lower(), upper(), url_decode(), len(), starts_with(f, "x"), ends_with(f, "x")
  # Actions: allow (pass now, skip every later check), skip (skip the checks in `skip`, keep evaluating rules),
  #   continue (stop evaluating rules), log (log and keep evaluating), block, captcha, external
  # Skip targets: CustomRules (the remaining rules), IPCAPTCHA, URLCAPTCHA, CountryRule, VerifyBot, ActionRule,
  #   HTTPFlood, ExternalMigration, Captcha
  rules:
    - id: block-wp-scan
      description: "WordPress probes on a non-WordPress site"
      expression: 'http.request.uri.path wildcard "/wp-*" and not ip.src in {10.0.0.0/8 192.168.0.0/16}'
      action: block
    - id: admin-hotlink
      expression: 'starts_with(http.request.uri.path, "/admin") and not http.referer wildcard "https://example.com/*"'
      action: captcha
    - id: api-key-skip-flood
      expression: 'starts_with(http.request.uri.path, "/api/") and http.request.headers["x-api-key"] ne ""'
      action: skip
      skip: [HTTPFlood, CountryRule]
    - id: monitor
      enabled: false
      expression: 'ip.src in {203.0.113.0/24} and http.user_agent contains "UptimeMonitor"'
      action: allow
