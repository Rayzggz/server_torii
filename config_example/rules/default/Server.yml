IPAllow:
  enabled: true
IPBlock:
  enabled: true
IPCAPTCHA:
  enabled: false
URLAllow:
  enabled: true
URLBlock:
  enabled: true
URLCAPTCHA:
  enabled: false
CountryRule:
  enabled: false
  default_action: block
  unknown_action: continue
  countries:
    GB: continue
    US: captcha
CAPTCHA:
  enabled: true
  provider: "hcaptcha"
  secret_key: "0378b0f84c4310279918d71a5647ba5d"
  captcha_validate_time: 600
  captcha_challenge_session_timeout: 120
  hcaptcha_secret: ""
  altcha_hmac_secret: "0378b0f84c4310279918d71a5647ba5d"
  altcha_cost: 50000
  CaptchaFailureLimit:
    - "300/300s"
  failure_block_duration: 1200
HTTPFlood:
  enabled: true
  HTTPFloodSpeedLimit:
    - "150/10s"
  HTTPFloodSameURILimit:
    - "50/10s"
  HTTPFloodFailureLimit:
    - "300/300s"
  failure_block_duration: 1200
VerifyBot:
  enabled: true
  verify_google_bot: true
  verify_bing_bot: true
  verify_baidu_bot: true
  verify_yandex_bot: true
  verify_sogou_bot: true
  verify_apple_bot: true
ExternalMigration:
  enabled: false
  redirect_url: "https://example.com/migration"
  secret_key: "0378b0f84c4310279918d71a5647ba5d"
  session_timeout: 1800
AdaptiveTrafficAnalyzer:
  enabled: true
  tag: "default_site"
  analysis_interval: 10
  window_buckets: 30
  browser_evidence: # decides which clients look like browsers; used by both detections and captcha_unverified
    ttl: 21600
    distinct_pages: 3
    asset_extensions: [] # empty uses the built-in static asset list
  uri_detection:
    action: captcha_unverified # observe | captcha_unverified | captcha | block; captcha_unverified challenges only clients without browser evidence
    block_duration: 600
    min_requests: 100
    min_distinct_ips: 50
    sustain: 60
    ratio_threshold: 5
    fallback_share: 0.8
    baseline:
      half_life: 21600
      warmup: 3600
      min_reference_requests: 200
  ip_detection:
    enabled: true
    action: observe # observe | captcha | block
    block_duration: 600
    max_block_duration: 86400
    score_threshold: 50
    hot_uri_min_hits: 3
    min_failures: 30
    fail_rate_threshold: 0.6
    scan_paths_threshold: 30
    max_broadcast_per_tick: 200
