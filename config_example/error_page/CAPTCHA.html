<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAPTCHA - ⛩️Server Torii</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
        }

        .container {
            text-align: left;
            max-width: 600px;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .icon svg {
            width: 60px;
            height: 60px;
            stroke: #333;
        }

        .message {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .description {
            margin-top: 10px;
            color: #666;
        }

        .toriiVerifyBox {
            margin-top: 10px;
            color: #666;
        }

        .toriiStatus {
            margin-top: 10px;
            min-height: 1.2em;
            color: #666;
        }

        .toriiStatus.error {
            color: #c0392b;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #999;
        }

        .footer a {
            color: red;
            text-decoration: none;
        }
    </style>
    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
    <script>
        const toriiCaptchaURL = "/torii/captcha";
        const toriiRequestTimeout = 15000;
        let toriiSubmitting = false;

        function setStatus(text, isError) {
            const el = document.getElementById("toriiStatus");
            if (!el) {
                return;
            }
            el.textContent = text;
            el.className = isError ? "toriiStatus error" : "toriiStatus";
        }

        function resetCaptcha() {
            try {
                if (window.hcaptcha) {
                    window.hcaptcha.reset();
                }
            } catch (e) {
            }
        }

        function reloadSoon() {
            setTimeout(() => window.location.reload(), 1500);
        }

        // Response contract of POST /torii/captcha:
        //   200 good       -> clearance cookie set, reload to continue
        //   200 bad        -> wrong or missing answer, solve again
        //   200 badSession -> session cookie expired or mismatched, reload for a new one
        //   503 error      -> CAPTCHA provider failed, safe to retry
        //   anything else  -> reload and let the gateway show the right page
        function handleResult(status, text) {
            if (status === 200 && text === "good") {
                setStatus("Verified, redirecting...", false);
                window.location.reload();
            } else if (status === 200 && text === "bad") {
                setStatus("Verification failed, please try again.", true);
                resetCaptcha();
            } else if (status === 200 && text === "badSession") {
                setStatus("Session expired, reloading...", true);
                reloadSoon();
            } else if (status === 0 || status >= 500) {
                setStatus("Verification service is temporarily unavailable, please try again.", true);
                resetCaptcha();
            } else {
                setStatus("Unexpected response, reloading...", true);
                reloadSoon();
            }
        }

        function submitCaptcha(reqBody) {
            if (toriiSubmitting) {
                return;
            }
            toriiSubmitting = true;
            setStatus("Verifying...", false);

            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), toriiRequestTimeout);
            fetch(toriiCaptchaURL, {
                method: "POST",
                headers: {"Content-Type": "application/x-www-form-urlencoded"},
                body: reqBody,
                credentials: "same-origin",
                cache: "no-store",
                signal: controller.signal
            })
                .then((resp) => resp.text().then((text) => handleResult(resp.status, text.trim())))
                .catch(() => handleResult(0, ""))
                .finally(() => {
                    clearTimeout(timer);
                    toriiSubmitting = false;
                });
        }

        function onSubmit(token) {
            submitCaptcha("h-captcha-response=" + encodeURIComponent(token));
        }

        function onCaptchaExpired() {
            setStatus("CAPTCHA expired, please solve it again.", true);
        }

        function onCaptchaError() {
            setStatus("CAPTCHA failed to load, please check your connection and try again.", true);
        }

        function checkCaptchaRender() {
            const captchaDiv = document.querySelector(".h-captcha");

            if (captchaDiv && captchaDiv.children.length > 0) {
            } else {
                document.getElementById("toriiVerifyBox").innerHTML = "Loading CAPTCHA failed, please check your internet connection and try again.";
            }
        }

        setTimeout(checkCaptchaRender, 5000);
    </script>
</head>
<body>
<div class="container">
    <div class="message">Checking that you are not a robot</div>
    <div class="toriiVerifyBox" id="toriiVerifyBox">
        <div class="h-captcha" data-sitekey="" data-callback="onSubmit"
             data-expired-callback="onCaptchaExpired" data-error-callback="onCaptchaError"></div>
    </div>
    <div class="toriiStatus" id="toriiStatus" role="status" aria-live="polite"></div>
    <div class="footer">
        DDoS Protection Powered by <a href="https://github.com/Rayzggz/server_torii">⛩️Server Torii</a>
    </div>
</div>

</body>
</html>
