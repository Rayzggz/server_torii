<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAPTCHA - ⛩️Server Torii</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
        }

        .container {
            text-align: left;
            max-width: 600px;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .icon svg {
            width: 60px;
            height: 60px;
            stroke: #333;
        }

        .message {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .description {
            margin-top: 10px;
            color: #666;
        }

        .toriiVerifyBox {
            margin-top: 10px;
            color: #666;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #999;
        }

        .footer a {
            color: red;
            text-decoration: none;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/gh/altcha-org/altcha@v3.0.2/dist/main/altcha.min.js" async defer></script>
    <script>
        const toriiWebPath = "/torii";

        function postAltcha(payload) {
            const reqBody = "altcha=" + encodeURIComponent(payload);
            const httpRequest = new XMLHttpRequest();
            httpRequest.open("POST", toriiWebPath + "/captcha", true);
            httpRequest.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
            httpRequest.send(reqBody);
            httpRequest.onreadystatechange = () => {
                if (httpRequest.readyState == 4 && httpRequest.status == 200) {
                    let text = httpRequest.responseText;
                    switch (text) {
                        case "good":
                            window.location.reload();
                            break;
                        case "bad":
                            alert("Bad CAPTCHA, please refresh the page and try again.");
                            window.location.reload();
                            break;
                        case "badSession":
                            alert("Session invalid, please refresh the page and try again.");
                            window.location.reload();
                            break;
                        default:
                            alert("Unexpected error occurred, please refresh the page and try again.");
                            window.location.reload();
                    }
                }
            };
        }

        function setupAltcha() {
            const widget = document.querySelector("altcha-widget");
            if (!widget) {
                return;
            }
            widget.setAttribute("challenge", toriiWebPath + "/captcha/challenge");
            widget.addEventListener("statechange", (ev) => {
                if (ev.detail.state === "verified" && ev.detail.payload) {
                    postAltcha(ev.detail.payload);
                }
            });
        }

        function checkCaptchaRender() {
            const captchaDiv = document.querySelector("altcha-widget");

            if (captchaDiv && captchaDiv.children.length > 0) {
            } else {
                document.getElementById("toriiVerifyBox").innerHTML = "Loading CAPTCHA failed, please check your internet connection and try again.";
            }
        }

        window.addEventListener("load", setupAltcha);
        setTimeout(checkCaptchaRender, 5000);
    </script>
</head>
<body>
<div class="container">
    <div class="message">Checking that you are not a robot</div>
    <div class="toriiVerifyBox" id="toriiVerifyBox">
        <altcha-widget name="altcha"></altcha-widget>
    </div>
    <div class="footer">
        DDoS Protection Powered by <a href="https://github.com/Rayzggz/server_torii">⛩️Server Torii</a>
    </div>
</div>

</body>
</html>
