# TEST ONLY: deliberately low thresholds and public test secrets.
IPAllow: {enabled: true}
IPBlock: {enabled: true}
IPCAPTCHA: {enabled: true}
URLAllow: {enabled: true}
URLBlock: {enabled: true}
URLCAPTCHA: {enabled: true}
CountryRule:
  enabled: false
  default_action: block
  unknown_action: continue
  countries: {US: captcha, AU: continue}
CAPTCHA:
  enabled: false
  provider: altcha
  secret_key: "e2e-only-captcha-secret-never-use-in-production"
  captcha_validate_time: 5
  captcha_challenge_session_timeout: 120
  altcha_hmac_secret: "e2e-only-altcha-secret-never-use-in-production"
  altcha_cost: 1
  CaptchaFailureLimit: ["20/30s"]
  failure_block_duration: 300
HTTPFlood:
  enabled: false
  HTTPFloodSpeedLimit: ["5/10s"]
  HTTPFloodSameURILimit: ["3/10s"]
  HTTPFloodFailureLimit: ["3/30s"]
  failure_block_duration: 300
VerifyBot:
  enabled: false
  verify_google_bot: true
  verify_bing_bot: true
  verify_baidu_bot: true
  verify_yandex_bot: true
  verify_sogou_bot: true
  verify_apple_bot: true
ExternalMigration:
  enabled: false
  redirect_url: "https://mitigation.invalid/verify"
  secret_key: "e2e-only-external-secret-never-use-in-production"
  session_timeout: 5
AdaptiveTrafficAnalyzer:
  enabled: false
  tag: disabled
  analysis_interval: 2
  window_buckets: 2
  uri_detection:
    action: observe
    block_duration: 300
    min_requests: 10
    min_distinct_ips: 5
    sustain: 2
    fallback_share: 0.8
  ip_detection:
    enabled: false
    action: block
    block_duration: 300
    min_failures: 5
    fail_rate_threshold: 0.5
CustomRules:
  enabled: false
  rules:
    - id: block-spam-referer
      expression: 'http.referer contains "spam.e2e"'
      action: block
    - id: log-everything
      expression: 'http.request.uri.path ne ""'
      action: log
    - id: block-delete
      expression: 'http.request.method eq "DELETE" and not ip.src in {198.18.1.0/24}'
      action: block
    - id: captcha-badbot
      expression: 'http.user_agent wildcard "*badbot*"'
      action: captcha
    - id: allow-monitor
      expression: 'ip.src in {198.18.2.0/24} and http.request.uri.path eq "/health"'
      action: allow
    - id: skip-api-flood
      expression: 'starts_with(http.request.uri.path, "/api/") and http.request.headers["x-api-key"] ne ""'
      action: skip
      skip: [HTTPFlood]
    - id: disabled-block-all
      enabled: false
      expression: 'true'
      action: block
