# TEST ONLY. Paths, port and node name are substituted in a temporary copy.
port: "@PORT@"
listen: [":@PORT@", "unix:@NODE@/torii.sock"]
web_path: /torii
error_page: "@NODE@/pages"
log_path: "@NODE@/log"
global_secret: "e2e-only-global-secret-never-use-in-production"
node_name: "Node_@INDEX@"
enable_gossip: true
sites:
  - id: default_site
    rule_path: "@NODE@/rules/default"
  - id: exact
    rule_path: "@NODE@/rules/exact"
  - id: wildcard
    rule_path: "@NODE@/rules/wildcard"
  - id: failures
    rule_path: "@NODE@/rules/failures"
  - id: unknown
    rule_path: "@NODE@/rules/unknown"
  - id: non200
    rule_path: "@NODE@/rules/non200"
  - id: uri
    rule_path: "@NODE@/rules/uri"
  - id: expiry
    rule_path: "@NODE@/rules/expiry"
  - id: non200expiry
    rule_path: "@NODE@/rules/non200expiry"
  - id: uriexpiry
    rule_path: "@NODE@/rules/uriexpiry"
default_site: default_site
peers:
